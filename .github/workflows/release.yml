name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  GO_VERSION: "1.25.6"
  NDK_VERSION: "27.2.12479018"

jobs:
  # Build Android APKs
  build-android-apks:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Verify sdkmanager
        run: sdkmanager --version

      - name: Setup Android NDK
        run: |
          yes | sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      # - name: Inject .env from secret
      #   run: |
      #     echo "${{ secrets.DOT_ENV }}" > .env
      #     dart run scripts/apply_env.dart

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/natproxy-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/natproxy-release.jks" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Set signing env vars
        run: |
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build golib.aar
        run: |
          cd golib
          gomobile bind -v \
            -ldflags="-checklinkname=0" \
            -target="android/arm64,android/arm,android/amd64,android/386" \
            -androidapi=24 \
            -o ../android/app/libs/golib.aar ./

      - name: Build split APKs
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-apks
          flutter build apk --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk    "release-apks/natproxy-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk  "release-apks/natproxy-${TAG}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk       "release-apks/natproxy-${TAG}-x86_64.apk"

      - name: Build universal APK
        run: |
          flutter build apk
          TAG="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-release.apk              "release-apks/natproxy-${TAG}-universal.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-apks/*.apk

  # Build natproxy-cli binaries
  build-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: android
            goarch: arm64
            name: android-arm64-v8a
            cgo_enabled: "1"
            ext: ""
          - goos: linux
            goarch: amd64
            name: linux-64
            cgo_enabled: "0"
            ext: ""
          - goos: linux
            goarch: arm64
            name: linux-arm64-v8a
            cgo_enabled: "0"
            ext: ""
          - goos: darwin
            goarch: amd64
            name: macos-64
            cgo_enabled: "0"
            ext: ""
          - goos: darwin
            goarch: arm64
            name: macos-arm64-v8a
            cgo_enabled: "0"
            ext: ""
          - goos: windows
            goarch: amd64
            name: windows-64
            cgo_enabled: "0"
            ext: ".exe"
          - goos: windows
            goarch: arm64
            name: windows-arm64-v8a
            cgo_enabled: "0"
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Verify sdkmanager
        run: sdkmanager --version

      - name: Setup Android NDK
        if: matrix.goos == 'android'
        run: |
          yes | sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Cross-compile natproxy-cli
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA::8}"

          # Set CC for Android NDK cross-compilation
          if [ "$GOOS" = "android" ]; then
            export CC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          fi

          cd natproxy-cli
          go build -trimpath \
            -ldflags "-checklinkname=0 -s -w -X natproxy/cli/cmd.Version=${TAG} -X natproxy/cli/cmd.Commit=${SHA}" \
            -o "natproxy-cli${{ matrix.ext }}" .

      - name: Create zip and digest
        run: |
          cd natproxy-cli
          zip "natproxy-cli-${{ matrix.name }}.zip" "natproxy-cli${{ matrix.ext }}"
          sha256sum "natproxy-cli-${{ matrix.name }}.zip" > "natproxy-cli-${{ matrix.name }}.zip.dgst"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: |
            natproxy-cli/natproxy-cli-${{ matrix.name }}.zip
            natproxy-cli/natproxy-cli-${{ matrix.name }}.zip.dgst

  # Build signaling server binaries
  build-signaling-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: android
            goarch: arm64
            name: android-arm64-v8a
            cgo_enabled: "1"
            ext: ""
          - goos: linux
            goarch: amd64
            name: linux-64
            cgo_enabled: "0"
            ext: ""
          - goos: linux
            goarch: arm64
            name: linux-arm64-v8a
            cgo_enabled: "0"
            ext: ""
          - goos: darwin
            goarch: amd64
            name: macos-64
            cgo_enabled: "0"
            ext: ""
          - goos: darwin
            goarch: arm64
            name: macos-arm64-v8a
            cgo_enabled: "0"
            ext: ""
          - goos: windows
            goarch: amd64
            name: windows-64
            cgo_enabled: "0"
            ext: ".exe"
          - goos: windows
            goarch: arm64
            name: windows-arm64-v8a
            cgo_enabled: "0"
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Verify sdkmanager
        run: sdkmanager --version

      - name: Setup Android NDK
        if: matrix.goos == 'android'
        run: |
          yes | sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Cross-compile signaling-server
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA::8}"

          # Set CC for Android NDK cross-compilation
          if [ "$GOOS" = "android" ]; then
            export CC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          fi

          cd signaling-server
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${TAG} -X main.Commit=${SHA}" \
            -o "signaling-server${{ matrix.ext }}" .

      - name: Create zip and digest
        run: |
          cd signaling-server
          zip "signaling-server-${{ matrix.name }}.zip" "signaling-server${{ matrix.ext }}"
          sha256sum "signaling-server-${{ matrix.name }}.zip" > "signaling-server-${{ matrix.name }}.zip.dgst"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signaling-server-${{ matrix.name }}
          path: |
            signaling-server/signaling-server-${{ matrix.name }}.zip
            signaling-server/signaling-server-${{ matrix.name }}.zip.dgst

  # Upload all to the release
  upload-release:
    runs-on: ubuntu-latest
    needs: [build-android-apks, build-cli, build-signaling-server]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.apk
            release-assets/**/*.zip
            release-assets/**/*.dgst
